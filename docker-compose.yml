x-app: &app
  build: .
  env_file:
    - ${FLUIDP_ENV_FILE:-.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  restart: unless-stopped

services:
  migrate:
    <<: *app
    profiles: ["maintenance"]
    restart: "no"
    environment:
      FLUIDP_PROCESS: migrate
      NPM_BIN_PATH: /usr/bin/npm
    volumes:
      - ./staticfiles:/app/staticfiles_prod
      - ./media:/app/media

  web:
    <<: *app
    environment:
      FLUIDP_PROCESS: web
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-localhost}
    ports:
      - "${FLUIDP_HTTP_BIND:-127.0.0.1:8080}:8000"
    volumes:
      - ./staticfiles:/app/staticfiles_prod:ro
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null -H Host:$${HEALTHCHECK_HOST} http://127.0.0.1:8000/login/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *app
    environment:
      FLUIDP_PROCESS: worker
    volumes:
      - ./staticfiles:/app/staticfiles_prod:ro
      - ./media:/app/media
    stop_grace_period: 30s
