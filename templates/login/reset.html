{% extends 'base.html' %}

{% load static %}

{% block content %}

    <div class="container mx-auto px-4">
        <section class="flex items-center justify-center min-h-screen">
            
            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 md:p-10 flex flex-col space-y-8">
                
                <img class="h-12" src="{% static 'images/logo-login.svg' %}" alt="FluiDP - Logo">

                <h3 class="block text-xl font-medium text-gray-700 mb-2 text-center">Redefinir senha</h3>

                <form method="post" novalidate>
                    {% csrf_token %}
                
                <div>
                    <label for="id_email" class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail
                    </label>

                    <input type="email" name="email" id="id_email" required autocomplete="email"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-700 shadow-sm 
                                  focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-8"
                           placeholder="seu.nome@email.com">
                    
                    {% if form.email.errors %}
                        <p class="text-red-600 text-xs mt-2">{{ form.email.errors.0 }}</p>
                    {% endif %}
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg font-semibold 
                               hover:bg-indigo-700 focus:outline-none focus:ring-2 
                               focus:ring-indigo-500 focus:ring-offset-2 transition-colors shadow-lg">
                    Enviar Link de Recuperação
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                    Voltar para o Login
                </a>
            </div>

        </div>
    </section>
</div>
{% endblock %}
