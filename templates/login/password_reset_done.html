{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container mx-auto px-4">
        <section class="flex items-center justify-center min-h-screen">
            
            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 md:p-10 flex flex-col space-y-6 text-center">
                
                {% if tema.logo %}
                    <img class="h-12" src="{% static 'images/logo-login-slate-400.svg' %}" alt="FluiDP - Logo">
                {% else %}
                    <img class="h-12" src="{% static 'images/logo-login-color.svg' %}" alt="FluiDP - Logo">
                {% endif %}

                <div class="mb-2">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                        <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Verifique seu E-mail</h2>
                    
                    <p class="text-gray-600 text-sm">
                        Enviamos instruções para definir sua nova senha. Caso não encontre, verifique sua caixa de spam.
                    </p>
                </div>

                <div class="pt-4">
                    <a href="{% url 'login' %}" 
                       class="w-full block bg-primary text-white py-3 px-4 rounded-lg font-semibold 
                              hover:bg-secondary focus:outline-none focus:ring-2 
                              focus:ring-primary focus:ring-offset-2 transition-colors duration-300 shadow-lg">
                        Voltar para o Login
                    </a>
                </div>
            </div>
        </section>
    </div>
{% endblock content %}
