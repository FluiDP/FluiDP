{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container mx-auto px-4">
        <section class="flex items-center justify-center min-h-screen">
            
            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 md:p-10 flex flex-col space-y-6 text-center">
                
                <img class="h-12 mx-auto" src="{% static 'images/logo-login.svg' %}" alt="FluiDP - Logo">

                <div class="mb-2">
                    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                        <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Senha Alterada!</h2>
                    
                    <p class="text-gray-600 text-sm">
                        Sua senha foi redefinida com sucesso. Você já pode acessar sua conta com a nova credencial.
                    </p>
                </div>

                <div class="pt-4">
                    <a href="{% url 'login' %}" 
                       class="w-full block bg-indigo-600 text-white py-3 px-4 rounded-lg font-semibold 
                              hover:bg-indigo-700 focus:outline-none focus:ring-2 
                              focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-300 shadow-lg">
                        Fazer Login
                    </a>
                </div>
            </div>
        </section>
    </div>
{% endblock content %}
