{% extends "base.html" %}

{% block title %}{% block error_title %}{% endblock %}{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-6 py-24 sm:py-32 lg:px-8">
  <div class="text-center">
    
    <p class="text-9xl font-extrabold text-emphasis">{% block error_code %}{% endblock %}</p>
    
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-primary sm:text-5xl">
      {% block error_name %}{% endblock %}
    </h1>
    
    <p class="mt-6 text-base leading-7 text-primary">
      {% block error_desc %}{% endblock %}
    </p>
    
    <div class="mt-10 flex items-center justify-center gap-x-6">
      <a
        href="{% url 'painel' %}"
        class="rounded-md bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-secondary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      >
        Voltar ao Início
      </a>
    </div>

  </div>
</main>
{% endblock content %}
