<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false"
     class="fixed inset-0 z-50 flex items-center justify-center w-screen h-screen p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

    <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white p-6 shadow-xl transition-all">
        
        <div class="flex w-full flex-col items-center justify-center text-center h-full animate-fade-in-up">
            
            <div class="w-16 h-16 bg-{{ color|default:'red' }}-50 rounded-full flex items-center justify-center mb-4 text-{{ color|default:'red' }}-500">
                <ion-icon name="{{ icon_name|default:'alert-circle' }}" class="w-8 h-8"></ion-icon>
            </div>

            <h3 class="text-xl font-bold text-gray-900 mb-2">
                {{ modal_title }}
            </h3>

            <div class="text-gray-500 text-sm mb-6 leading-relaxed">
                {{ message|safe }}
            </div>

            <div class="mt-2 grid grid-cols-2 gap-3 w-full">
                <button type="button" 
                        @click="open = false" 
                        class="w-full flex flex-1 justify-center rounded-full px-6 py-3 text-base font-semibold border border-primary text-primary shadow-sm hover:bg-indigo-100 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary">
                    Cancelar
                </button>
                
                <form method="post" action="{{ action_url }}" hx-post="{{ action_url }}" hx-target="#modal-spot" hx-swap="innerHTML" class="w-full">
                    {% csrf_token %}
                    <button type="submit"
                            class="w-full justify-center rounded-full bg-primary px-6 py-3 text-base font-semibold text-white shadow-sm hover:bg-primary focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                        {{ submit_text }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
