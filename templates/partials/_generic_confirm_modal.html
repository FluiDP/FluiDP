<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false"
     class="fixed inset-0 z-[60] flex items-center justify-center w-full h-[100dvh] p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

    <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-2xl max-h-[90dvh] overflow-y-auto rounded-2xl bg-white p-5 sm:p-6 md:p-8 shadow-xl transition-all">
        
        <div class="flex w-full flex-col items-center justify-center text-center h-full animate-fade-in-up">
            
            <div class="w-12 h-12 sm:w-16 sm:h-16 bg-{{ color|default:'red' }}-50 rounded-full flex items-center justify-center mb-3 sm:mb-4 text-{{ color|default:'red' }}-500 shrink-0">
                <ion-icon name="{{ icon_name|default:'alert-circle' }}" class="w-6 h-6 sm:w-8 sm:h-8"></ion-icon>
            </div>

            <h3 class="text-lg sm:text-xl font-bold text-gray-900 mb-1 sm:mb-2">
                {{ modal_title }}
            </h3>

            <div class="text-gray-500 text-xs sm:text-sm mb-5 sm:mb-6 leading-relaxed">
                {{ message|safe }}
            </div>

            <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3 w-full">
                <button type="button" 
                        @click="open = false" 
                        class="w-full flex flex-1 justify-center rounded-full px-4 sm:px-6 py-2.5 sm:py-3 text-sm sm:text-base font-semibold border border-primary text-primary shadow-sm hover:bg-indigo-100 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                    Cancelar
                </button>
                
                <form method="post" action="{{ action_url }}"
                      hx-post="{{ action_url }}"
                      hx-target="{{ hx_target|default:'#modal-spot' }}"
                      hx-swap="innerHTML"
                      {% if after_request %}hx-on::after-request="{{ after_request }}"{% endif %}
                      class="w-full">
                    {% csrf_token %}
                    <button type="submit"
                            class="w-full justify-center rounded-full bg-primary px-4 sm:px-6 py-2.5 sm:py-3 text-sm sm:text-base font-semibold text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                        {{ submit_text }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
