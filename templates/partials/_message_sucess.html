<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false" 
     class="fixed inset-0 z-50 flex items-center justify-center w-screen h-screen p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

    <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white p-6 shadow-xl transition-all">
        
        <div hx-target="#modal-spot" class="flex w-full flex-col items-center justify-center text-center h-full animate-fade-in-up">
            
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4 text-green-600">
                <ion-icon name="checkmark-circle" class="w-10 h-10"></ion-icon>
            </div>

            <h3 class="text-xl font-bold text-gray-900 mb-2">
                Sucesso!
            </h3>

            <p class="text-gray-500 mb-6">
                {{ message|default:"Ação realizada com sucesso." }}
            </p>

            <button type="button" 
                    @click="open = false" 
                    class="w-full flex flex-1 justify-center rounded-full px-6 py-3 text-base font-semibold bg-emphasis border border-primary text-primary shadow-sm hover:opacity-80 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                Ok
            </button>
        </div>
    </div>
</div>
