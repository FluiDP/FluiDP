<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false" 
     class="fixed inset-0 z-[60] flex items-center justify-center w-full h-[100dvh] p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

    <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-2xl max-h-[90dvh] overflow-y-auto rounded-2xl bg-white p-5 sm:p-6 md:p-8 shadow-xl transition-all">
        
        <div hx-target="#modal-spot" class="flex w-full flex-col items-center justify-center text-center h-full animate-fade-in-up">
            
            <div class="w-12 h-12 sm:w-16 sm:h-16 bg-green-100 rounded-full flex items-center justify-center mb-3 sm:mb-4 text-green-600 shrink-0">
                <ion-icon name="checkmark-circle" class="w-8 h-8 sm:w-10 sm:h-10"></ion-icon>
            </div>

            <h3 class="text-lg sm:text-xl font-bold text-gray-900 mb-1 sm:mb-2">
                Sucesso!
            </h3>

            <p class="text-gray-500 text-xs sm:text-sm mb-5 sm:mb-6 leading-relaxed">
                {{ message|default:"Ação realizada com sucesso." }}
            </p>

            <button type="button" 
                    @click="open = false" 
                    class="w-full flex justify-center rounded-full px-4 sm:px-6 py-2.5 sm:py-3 text-sm sm:text-base font-semibold bg-emphasis border border-primary text-primary shadow-sm hover:opacity-80 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-primary transition-all mt-2 sm:mt-4">
                Ok
            </button>
        </div>
    </div>
</div>
