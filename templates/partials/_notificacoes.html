{% if request.user.is_authenticated %}
<div id="notificacoes-widget">
    <button type="button"
            aria-label="Abrir notificações"
            aria-controls="notificacoes-drawer"
            aria-expanded="false"
            onclick="abrirNotificacoes(this)"
            hx-post="{% url 'visualizar_notificacoes' %}"
            hx-target="#lista-notificacoes"
            hx-swap="innerHTML"
            style="position:fixed;top:1rem;right:1rem;z-index:10001;width:3rem;height:3rem;"
            class="rounded-full bg-white text-slate-700 shadow-xl border border-slate-100 flex items-center justify-center hover:text-primary hover:scale-105">
        <ion-icon name="notifications-outline" class="text-2xl"></ion-icon>
        <span id="notificacoes-indicador"
              {% if not tem_notificacoes_nao_visualizadas %}hidden{% endif %}
              class="absolute top-1 right-1 w-3 h-3 bg-red-500 border-2 border-white rounded-full"></span>
    </button>

    <div id="notificacoes-backdrop" hidden onclick="fecharNotificacoes()"
         style="position:fixed;inset:0;z-index:10002;background:rgba(15,23,42,.3);"></div>

    <aside id="notificacoes-drawer"
           aria-hidden="true"
           style="position:fixed;top:0;right:0;z-index:10003;height:100dvh;width:100%;max-width:24rem;transform:translateX(100%);transition:transform .25s ease;"
           class="bg-white shadow-2xl flex flex-col">
        <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h2 class="font-bold text-lg text-slate-900">Notificações</h2>
                <p class="text-xs text-slate-500">Avisos recentes do FluiDP</p>
            </div>
            <button type="button" onclick="fecharNotificacoes()"
                    class="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-500">
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </header>
        <div id="lista-notificacoes" class="flex-1 overflow-y-auto">
            <div class="h-full flex items-center justify-center text-sm text-slate-400">
                Carregando notificações...
            </div>
        </div>
    </aside>
    <div id="notificacoes-modal-spot"></div>
</div>
<script>
    function abrirNotificacoes(botao) {
        const drawer = document.getElementById('notificacoes-drawer');
        const backdrop = document.getElementById('notificacoes-backdrop');
        drawer.style.transform = 'translateX(0)';
        drawer.setAttribute('aria-hidden', 'false');
        backdrop.hidden = false;
        botao.setAttribute('aria-expanded', 'true');
    }

    function fecharNotificacoes() {
        const drawer = document.getElementById('notificacoes-drawer');
        const backdrop = document.getElementById('notificacoes-backdrop');
        const botao = document.querySelector('[aria-controls="notificacoes-drawer"]');
        drawer.style.transform = 'translateX(100%)';
        drawer.setAttribute('aria-hidden', 'true');
        backdrop.hidden = true;
        if (botao) botao.setAttribute('aria-expanded', 'false');
    }

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') fecharNotificacoes();
    });

    document.body.addEventListener('notificacoesAtualizadas', function (event) {
        const indicador = document.getElementById('notificacoes-indicador');
        if (indicador) indicador.hidden = !event.detail.temNaoLidas;
    });
</script>
{% endif %}
