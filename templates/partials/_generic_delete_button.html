{% if item and item.id and url %}
<button hx-get="{{ url }}"
        hx-target="#modal-spot" 
        hx-swap="innerHTML"
        class="rounded-full bg-red-400 p-1.5 text-xs font-semibold text-white shadow-sm hover:bg-red-300 transition-colors"
        title="Deletar">
    <ion-icon name="trash-outline"></ion-icon>
</button>
{% endif %}
