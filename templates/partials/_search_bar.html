<div class="search-bar-wrapper flex flex-1">
    
    <div class="flex-1 flex items-center relative">
        <ion-icon name="search-outline" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none"></ion-icon>
        
        <input type="search"
               id="search-input-{{ target_ids }}" 
               name="q"
               value="{{ value|default:'' }}" 
               placeholder="{{ placeholder|default:'Pesquisar...' }}"
               
               hx-get="." 
               hx-trigger="input changed delay:500ms, search, keyup[key=='Enter']" 
               hx-target="#{{ target_ids }}" 
               hx-swap="outerHTML"
               hx-push-url="true"
               
               autofocus
               onfocus="var temp_value=this.value; this.value=''; this.value=temp_value"
               
               class="w-full pl-10 pr-10 py-2 bg-white rounded-full shadow hover:shadow-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
    </div>

</div>
