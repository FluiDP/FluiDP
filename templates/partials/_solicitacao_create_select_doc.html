<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false" 
     class="absolute top-0 left-0 flex items-center justify-center w-screen h-screen z-1 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

     <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="top-1/2 min-w-1/4 max-w-1/2 max-h-[90vh] transform overflow-auto rounded-2xl bg-white p-6 shadow-xl transition-all">
        
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl text-center font-bold text-gray-900">
                    Escolher documento
                </h3>
                <button type="button" @click="open = false" class="text-gray-400 hover:text-gray-600">
                    <span class="sr-only">Fechar</span>
                    <ion-icon name="close-outline" class="w-6 h-6"></ion-icon>
                </button>
            </div>

            <div class="flex flex-1 gap-3 flex-wrap">
                {% for tipo in tipos_documento %}
                    <button hx-get="{% url 'colaborador:get_create_solicitacao_form' tipo.id %}"
                            hx-target="#modal-spot"
                            hx-swap="innerHTML"
                            class="rounded-full bg-indigo-50 px-4 py-2 grow shadow hover:shadow-lg {% if not tipo.ativo %}opacity-50 cursor-not-allowed{% endif %}">
                        {{ tipo.nome_documento }}
                    </button>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
