<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false" 
     class="fixed inset-0 z-[60] flex items-center justify-center w-full h-[100dvh] p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

     <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-3xl max-h-[90dvh] overflow-y-auto rounded-2xl bg-white p-4 sm:p-6 md:p-8 shadow-xl transition-all">
        
        <div>
            <div class="flex justify-between items-center mb-4 sm:mb-6">
                <h3 class="text-lg sm:text-xl font-bold text-gray-900">
                    Escolher documento
                </h3>
                <button type="button" @click="open = false" class="text-gray-400 hover:text-gray-600 transition-colors p-1 -mr-1 rounded-full hover:bg-slate-100">
                    <span class="sr-only">Fechar</span>
                    <ion-icon name="close-outline" class="w-6 h-6"></ion-icon>
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {% for tipo in tipos_documento %}
                <button 
                    hx-get="{% url 'colaborador:get_create_solicitacao_form' tipo.id %}" 
                    hx-target="#modal-spot" 
                    hx-swap="innerHTML" 
                    {% if not tipo.ativo %}disabled{% endif %}
                    class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 bg-white shadow-sm transition-all duration-200 group text-left w-full
                        {% if not tipo.ativo %} opacity-60 cursor-not-allowed bg-gray-50 border-gray-100 
                        {% else %} hover:border-primary hover:shadow-md hover:-translate-y-0.5 active:scale-95 cursor-pointer {% endif %}">
                    
                    <!-- Ícone decorativo (exemplo) -->
                    <div class="p-2 rounded-lg {% if tipo.ativo %}bg-emphasis text-primary{% else %}bg-gray-100 text-gray-400{% endif %}">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    </div>

                    <!-- Texto do Documento -->
                    <div class="flex-1">
                    <span class="block font-medium text-gray-800 {% if not tipo.ativo %}text-gray-500{% endif %}">
                        {{ tipo.nome_documento }}
                    </span>
                    {% if tipo.ativo %}
                    <span class="text-xs text-primary">Clique para solicitar</span>
                    {% else %}
                    <span class="text-xs text-gray-500">Indisponível ou fora do período</span>
                    {% endif %}
                    </div>
                </button>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
