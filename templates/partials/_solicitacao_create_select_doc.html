<div x-data="{ open: true }" 
     @keydown.escape.window="open = false" 
     x-show="open" 
     x-transition:enter="ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="open = false" 
     class="fixed inset-0 z-[60] flex items-center justify-center w-full h-[100dvh] p-4 bg-[rgba(0,0,0,0.5)] backdrop-blur transition-opacity">

     <div x-show="open"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.stop
         class="relative w-full max-w-2xl max-h-[90dvh] overflow-y-auto rounded-2xl bg-white p-5 sm:p-6 md:p-8 shadow-xl transition-all">
        
        <div>
            <div class="flex justify-between items-center mb-4 sm:mb-6">
                <h3 class="text-lg sm:text-xl font-bold text-gray-900">
                    Escolher documento
                </h3>
                <button type="button" @click="open = false" class="text-gray-400 hover:text-gray-600 transition-colors p-1 -mr-1 rounded-full hover:bg-slate-100">
                    <span class="sr-only">Fechar</span>
                    <ion-icon name="close-outline" class="w-6 h-6"></ion-icon>
                </button>
            </div>

            <div class="flex flex-1 gap-2 sm:gap-3 flex-wrap">
                {% for tipo in tipos_documento %}
                    <button hx-get="{% url 'colaborador:get_create_solicitacao_form' tipo.id %}"
                            hx-target="#modal-spot"
                            hx-swap="innerHTML"
                            class="w-full sm:w-auto flex-1 rounded-xl sm:rounded-full bg-emphasis text-primary font-semibold text-sm sm:text-base px-4 py-3 sm:py-2 shadow-sm hover:shadow-md transition-all hover:opacity-80 active:scale-95 {% if not tipo.ativo %}opacity-50 cursor-not-allowed{% endif %}">
                        {{ tipo.nome_documento }}
                    </button>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
