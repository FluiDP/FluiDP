<section class="flex flex-1 flex-col gap-2 min-h-0">
    <header class="p-2">
        <h2 class="text-2xl font-bold">Meu perfil</h2>
    </header>
    <div class="flex flex-1 flex-col gap-2 min-h-0">
        <main class="flex-1 flex flex-col p-6 bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="flex flex-col flex-1 min-h-0">
                <h3 class="text-xl font-semibold pt-2 pb-2">Solicitações</h3>
                <div class="p-5 bg-slate-50 text-slate-600 box-border flex-1 mt-1 mb-1 rounded-lg overflow-y-auto min-h-0">
                    <div>
                        <label for="profile_nome" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                        <input type="text" id="profile_nome" disabled 
                                value="{{ user.get_full_name }}" 
                                class="p-2 mb-2 block w-full rounded-lg border-gray-300 shadow-sm bg-gray-100 text-gray-500 focus:ring-0">
                    </div>

                    <div>
                        <label for="profile_matricula" class="block text-sm font-medium text-gray-700">Matrícula</label>
                        <input type="text" id="profile_matricula" disabled 
                                value="{{ user.matricula }}" 
                                class="p-2 mb-2 block w-full rounded-lg border-gray-300 shadow-sm bg-gray-100 text-gray-500 focus:ring-0">
                    </div>

                    <div>
                        <label for="profile_email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="profile_email" disabled 
                                value="{{ user.email }}" 
                                class="p-2 mb-2 block w-full rounded-lg border-gray-300 shadow-sm bg-gray-100 text-gray-500 focus:ring-0">
                    </div>

                    <div>
                        <label for="profile_lotacao" class="block text-sm font-medium text-gray-700">Lotação / Setor</label>
                        <input type="text" id="profile_lotacao" disabled 
                                value="{{ user.lotacao|default:'Não definida' }}" 
                                class="p-2 mb-2 block w-full rounded-lg border-gray-300 shadow-sm bg-gray-100 text-gray-500 focus:ring-0">
                    </div>

                    <div>
                        <label for="profile_cargo" class="block text-sm font-medium text-gray-700">Cargo</label>
                        <input type="text" id="profile_cargo" disabled 
                                value="{{ user.cargo|default:'Não definido' }}" 
                                class="p-2 mb-2 block w-full rounded-lg border-gray-300 shadow-sm bg-gray-100 text-gray-500 focus:ring-0">
                    </div>

                    <div class="mt-4">
                        <a href="{% url 'reset_password' %}" class="text-sm font-medium text-primary hover:opacity-80 transition-opacity">
                            Redefinir senha
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</section>

<div id="modal-spot"></div>
