{% for cargo in cargos %}
<tr class="px-2 rounded-full hover:shadow hover:bg-white p-2">
    <td class="p-2 first:rounded-l-full last:rounded-r-full">{{ cargo.nome_cargo }}</td>
    <td class="p-2">{{ cargo.get_hierarquia_display }}</td>
    <td class="p-2 first:rounded-l-full last:rounded-r-full">
        {% comment %} ações {% endcomment %}
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="py-2 text-center">Nenhum cargo encontrado.</td>
</tr>
{% endfor %}
