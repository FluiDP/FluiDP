{% extends 'painel.html' %}

{% block painel_name %}
    <h1 class="text-2xl font-bold">Painel de Administração</h1>
{% endblock painel_name %}

{% block menu_actions %}
    <a href="{% url 'dp:home' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="home-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Início</span>
    </a>
    <a href="{% url 'dp:lotacoes' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="layers-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Gerenciar Lotações</span>
    </a>
    <a href="{% url 'dp:colaboradores' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="people-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Gerenciar Colaboradores</span>
    </a>
    <a href="{% url 'dp:documentos' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="reader-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Gerenciar Documentos</span>
    </a>
    <a href="{% url 'dp:cargos' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="grid-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Gerenciar Cargos</span>
    </a>
    <a href="{% url 'dp:solicitacoes' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon class="text-slate-500" name="file-tray-full-outline"></ion-icon>
        <span class="ml-3" :class="sidebarOpen ? 'block' : 'hidden'">Histórico de Solicitações</span>
    </a>
{% endblock menu_actions %}
