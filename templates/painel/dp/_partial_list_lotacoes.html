{% for lotacao in lotacoes %}
<tr class="px-2 rounded-full hover:shadow hover:bg-white p-2">
    <td class="p-2 first:rounded-l-full last:rounded-r-full">{{ lotacao.nome_lotacao }}</td>
    <td class="p-2 text-slate-400 italic">{{ lotacao.lotacao_fullname }}</td>
    <td class="p-2">{{ lotacao.chefia }}</td>
    <td class="p-2 first:rounded-l-full last:rounded-r-full"></td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="py-2 text-center">Nenhuma lotação encontrada.</td>
</tr>
{% endfor %}
