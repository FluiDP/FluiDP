{% for colaborador in colaboradores %}
<tr class="px-2 rounded-full hover:shadow hover:bg-white p-2">
    <td class="p-2 first:rounded-l-full last:rounded-r-full">{{ colaborador.matricula }}</td>
    <td class="p-2">{{ colaborador.first_name }} {{ colaborador.last_name }}</td>
    <td class="p-2">{{ colaborador.cargo }}</td>
    <td class="p-2">{{ colaborador.lotacao.lotacao_fullname }}</td>
    <td class="p-2 first:rounded-l-full last:rounded-r-full">
        {% comment %} ações {% endcomment %}
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="py-2 text-center">Nenhum colaborador encontrado.</td>
</tr>
{% endfor %}
