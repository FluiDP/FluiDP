{% extends 'painel.html' %}

{% block menu_actions %}
    {% if user.cargo.hierarquia == 2 or user.cargo.hierarquia == 3 %}
    <a href="{% url 'gestor:dashboard' %}"
        class="flex items-center rounded-full hover:bg-indigo-100 hover:text-indigo-800 hover:font-semibold p-2 transition-colors"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon name="pie-chart-outline" class="text-xl"></ion-icon>
        <span class="ml-3 whitespace-nowrap" :class="sidebarOpen ? 'block' : 'hidden'">Dashboard</span>
    </a>
    {% else %}
    <a href="{% url 'colaborador:home' %}"
        class="flex items-center rounded-full hover:bg-indigo-100 hover:text-indigo-800 hover:font-semibold p-2 transition-colors"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon name="home-outline" class="text-xl"></ion-icon>
        <span class="ml-3 whitespace-nowrap" :class="sidebarOpen ? 'block' : 'hidden'">Início</span>
    </a>
    {% endif %}

    <a href="{% url 'colaborador:solicitacoes' %}"
        class="flex items-center rounded-full hover:bg-indigo-100 hover:text-indigo-800 hover:font-semibold p-2 transition-colors"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon name="document-text-outline" class="text-xl"></ion-icon>
        <span class="ml-3 whitespace-nowrap" :class="sidebarOpen ? 'block' : 'hidden'">Solicitações</span>
    </a>

{% endblock menu_actions %}
