{% extends 'painel.html' %}

{% block menu_actions %}
    <a href="{% url 'gestor:home' %}"
        class="flex items-center  rounded-full hover:bg-indigo-100 hover:text-indigo-800 hover:font-semibold p-2"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon  name="home-outline"></ion-icon>
        <span class="ml-3 hover:text-semibold" :class="sidebarOpen ? 'block' : 'hidden'">Início</span>
    </a>
{% endblock menu_actions %}
