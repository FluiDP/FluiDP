{% extends 'painel.html' %}

{% block menu_actions %}
    <a href="{% url 'gestor:dashboard' %}"
        class="flex items-center rounded-full hover:bg-emphasis hover:text-primary hover:font-semibold p-2 transition-colors"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon name="pie-chart-outline" class="text-xl"></ion-icon>
        <span class="ml-3 whitespace-nowrap" :class="sidebarOpen ? 'block' : 'hidden'">Dashboard</span>
    </a>
    <a href="{% url 'gestor:solicitacoes' %}"
        class="flex items-center rounded-full hover:bg-emphasis hover:text-primary hover:font-semibold p-2 transition-colors"
        hx-target="#content-swap" 
        hx-swap="innerHTML"
        :class="sidebarOpen ? 'justify-start' : 'justify-center'"
    >
        <ion-icon name="document-text-outline" class="text-xl"></ion-icon>
        <span class="ml-3 whitespace-nowrap" :class="sidebarOpen ? 'block' : 'hidden'">Solicitações</span>
    </a>
{% endblock menu_actions %}
