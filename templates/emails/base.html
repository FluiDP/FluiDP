{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluiDP</title>
    <style>
        body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; display: flex; justify-content: center; align-items: center; }
        table, td { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        
        .fluid-img { max-width: 100%; height: auto; }
    </style>
</head>
<body style="background-color: {{ tema.emphasis_color|default:'#f3f4f6' }}; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #374151; margin: 0; padding: 0;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="40" border="0" style="background-color: {{ tema.emphasis_color|default:'#f3f4f6' }}; width: 100%;">
        <tr>
            <td align="center">

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 480px; background-color: #ffffff; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); overflow: hidden; margin: 0 auto;">
                    
                    <tr>
                        <td style="padding: 40px 40px 0 40px; text-align: center;">
                            <img src="{{ protocol|default:'http' }}://{{ domain|default:'127.0.0.1:8000' }}{% static 'images/header-logo.png' %}" 
                                 alt="FluiDP" 
                                 style="height: 45px; width: auto; display: block; margin: 0 auto;" 
                                 border="0">
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 30px 40px 40px 40px; font-size: 16px; line-height: 1.6; color: #4b5563;">
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>
                </table>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 480px; margin: 0 auto;">
                    <tr>
                        <td style="padding: 24px 10px; text-align: center; font-size: 12px; color: #9ca3af;">
                            
                            <p style="margin: 0 0 8px 0;">FluiDP - Fluxo Integrado de Solicitações ao Departamento Pessoal</p>
                            
                            <p style="margin: 0;">
                                Esta mensagem foi enviada automaticamente.<br>
                                Por favor, não responda a este e-mail.
                            </p>

                        </td>
                    </tr>
                </table>

                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                    <tr><td height="40"></td></tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
