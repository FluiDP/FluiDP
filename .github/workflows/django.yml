name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME_CI }}
          POSTGRES_USER: ${{ env.DB_USER_CI }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD_CI }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    env:
      DB_NAME_CI: 'sistemadp_test'
      DB_USER_CI: 'postgres'
      DB_PASSWORD_CI: 'supersecret_ci_password'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # IMPORTANTE: Instala o driver do Postgres
        pip install psycopg2-binary
        
    - name: Run Tests
      run: |
        python manage.py test
      env:
        DJANGO_SECRET_KEY: 'dummy-key-for-ci-tests'
        DJANGO_DEBUG: 'True'
        
        DB_NAME: ${{ env.DB_NAME_CI }}
        DB_USER: ${{ env.DB_USER_CI }}
        DB_PASSWORD: ${{ env.DB_PASSWORD_CI }}
        
        DB_HOST: 'postgres'
        DB_PORT: '5432'
