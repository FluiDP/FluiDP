services:
  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_DB: fluidp_local
      POSTGRES_USER: fluidp_local
      POSTGRES_PASSWORD: fluidp_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluidp_local -d fluidp_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  migrate:
    depends_on:
      db:
        condition: service_healthy

  web:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
